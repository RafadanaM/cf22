name: Deploy Site

on:
  push:
    branches: ['master']

jobs:
  build-and-deply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install Deps
        run: bun install

      - name: Build Static Site
        run: |
          bun run build

      - name: Deploy Static Site
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz --delete
          path: .output/
          remote_path: /home/${{ secrets.HOST_USER }}/apps/cf22
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.HOST_USER }}
          remote_key: ${{ secrets.HOST_SSH_KEY }}

      - name: Deploy Nginx Config
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz
          path: deploy/nginx/app.conf
          remote_path: /etc/nginx/conf.d/cf22.rafadana.com.conf
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.HOST_USER }}
          remote_key: ${{ secrets.HOST_SSH_KEY }}

      - name: Test & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_SSH_KEY }}
          script: |
            sudo nginx -t
            sudo systemctl reload nginx
