server {
    server_name cf22.rafadana.com www.cf22.rafadana.com;

    # Static build output (TanStack Start prerendered output)
    root /home/eresh/apps/cf22/public;
    index index.html;

    # --- GZIP ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # --- API PROXY (Bun/Elysia backend) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # --- CACHING: HTML (7 days) ---
    location ~* \.html$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        etag on;
        try_files $uri $uri.html $uri/ =404;
    }

    # --- CACHING: static assets (30 days) ---
    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|ico|svg|woff2?|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- MAIN ROUTING ---
    location / {
        try_files $uri $uri.html $uri/ =404;
    }


    # --- CUSTOM 404 ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cf22.rafadana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cf22.rafadana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.cf22.rafadana.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = cf22.example.com) {
        return 301 https://$host$request_uri;
    }

    server_name cf22.rafadana.com www.cf22.rafadana.com;
    listen 80;
    return 404;
}
